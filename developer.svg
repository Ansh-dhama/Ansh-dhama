    <text x="163" y="143" fill="#96CFAE">public class Application {</text>
    <text x="170" y="157" fill="#96CFAE">// build something useful</text>
    <text x="163" y="171" fill="#96CFAE">}</text>
    <text x="163" y="184" fill="#00FF88">$ ./mvnw spring-boot:run</text>

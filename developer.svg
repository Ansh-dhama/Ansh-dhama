<svg xmlns="http://www.w3.org/2000/svg" width="360" height="290" viewBox="0 0 360 290" role="img" aria-labelledby="title desc">
  <title id="title">Java backend developer</title>
  <desc id="desc">A developer with headphones writing Java code at a green terminal, with a blinking cursor.</desc>
